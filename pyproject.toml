[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2c"
version = "0.4.0"
description = "Hardware2Code: Parse EDA netlist/BOM, generate MISRA-C embedded firmware for STM32"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "hw2c contributors"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Code Generators",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
hw2c = "parser.cli:main"

[project.urls]
Homepage = "https://github.com/user/hw2c"
Repository = "https://github.com/user/hw2c"

[tool.setuptools]
packages = ["parser", "generator", "parser.tests", "generator.tests"]

[tool.setuptools.package-data]
parser = ["hardware_design/*"]
generator = ["templates/**/*", "static/**/*"]

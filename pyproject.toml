[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware2code"
version = "1.0.0"
description = "STM32G0B1 project generator from hardware YAML descriptions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
hardware2code = "generator.generate:main"
hw2c = "generator.generate:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.11.0",
]

[tool.setuptools.packages.find]
include = ["generator*", "parser*"]

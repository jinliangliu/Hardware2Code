name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # 锁定 Python 版本，避免行为不一致
  PYTHON_VERSION: "3.11"
  # 示例项目路径（可根据需要调整）
  EXAMPLE_PATH: "examples/rtc_advanced"
  OUTPUT_DIR: "output/rtc_adv"

jobs:
  # ============================================================
  # Job 1: Lint & Format（快速检查，提前发现代码风格问题）
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pyyaml jinja2 pydantic

      - name: Run Python lint (flake8)
        run: |
          pip install flake8
          flake8 generator/ --count --max-complexity=15 --statistics --extend-ignore=E501,W503
        continue-on-error: true

      - name: Check Python formatting (black)
        run: |
          pip install black
          black --check --diff generator/ || true

  # ============================================================
  # Job 2: Build & Test（主要构建任务）
  # ============================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint  # 只有 Lint 通过才执行构建

    steps:
      # ---------- 1. Checkout ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 缓存 Git 子模块信息，加速后续 fetch
          fetch-depth: 0

      # ---------- 2. Setup Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pyyaml jinja2 pydantic

      # ---------- 3. Install system dependencies ----------
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      # ---------- 4. Cache ARM GCC Toolchain ----------
      # 使用官方 action，自带缓存机制，避免每次从 arm.com 下载
      - name: Install ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          # 使用稳定版本，与项目要求匹配
          release: "13.2.rel1"

      # 验证工具链安装
      - name: Verify Toolchain
        run: arm-none-eabi-gcc --version

      # ---------- 5. Cache pip packages ----------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- 6. Generate Code ----------
      - name: Generate code from YAML
        id: generate
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          python generator/generate.py \
            -i ${{ env.EXAMPLE_PATH }}/hardware.yaml \
            --task ${{ env.EXAMPLE_PATH }}/task.yaml \
            --bind ${{ env.EXAMPLE_PATH }}/bind.yaml \
            -o ${{ env.OUTPUT_DIR }} \
            --force -v
        continue-on-error: false

      # 如果生成失败，输出错误信息
      - name: Upload generation logs (on failure)
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generation-error-logs
          path: |
            ${{ env.OUTPUT_DIR }}/*.log
            generator/*.log

      # ---------- 7. Build Firmware ----------
      - name: Build firmware
        id: build
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake 2>&1 | tee build.log
          cmake --build build 2>&1 | tee -a build.log
        continue-on-error: false

      # 上传构建日志（无论成功失败都保留）
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.OUTPUT_DIR }}/build.log

      # ---------- 8. Upload generated firmware ----------
      - name: Upload firmware binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ env.OUTPUT_DIR }}/build/*.elf
            ${{ env.OUTPUT_DIR }}/build/*.bin
            ${{ env.OUTPUT_DIR }}/build/*.hex
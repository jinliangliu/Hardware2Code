name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # 锁定 Python 版本，避免行为不一致
  PYTHON_VERSION: "3.11"
  # 示例项目路径（可根据需要调整）
  EXAMPLE_PATH: "examples/rtc_advanced"
  OUTPUT_DIR: "output/rtc_adv"

jobs:
  # ============================================================
  # Job 1: Lint & Format（快速检查，提前发现代码风格问题）
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pyyaml jinja2 pydantic

      - name: Run Python lint (flake8)
        run: |
          pip install flake8
          flake8 generator/ --count --max-complexity=10 --statistics

      - name: Check Python formatting (black)
        run: |
          pip install black
          black --check generator/

  # ============================================================
  # Job 2: Build & Test（主要构建任务）
  # ============================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint  # 只有 Lint 通过才执行构建

    steps:
      # ---------- 1. Checkout ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 缓存 Git 子模块信息，加速后续 fetch
          fetch-depth: 0

      # ---------- 2. Setup Python ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pyyaml jinja2 pydantic

      # ---------- 3. Cache ARM GCC Toolchain ----------
      # 使用官方 action，自带缓存机制，避免每次从 arm.com 下载
      - name: Install ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          # 使用稳定版本，与项目要求匹配
          release: "13.2.rel1"

      # 验证工具链安装
      - name: Verify Toolchain
        run: arm-none-eabi-gcc --version

      # ---------- 4. Cache pip packages ----------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- 5. Generate Code ----------
      - name: Generate code from YAML
        id: generate
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          python generator/generate.py \
            -i ${{ env.EXAMPLE_PATH }}/hardware.yaml \
            -o ${{ env.OUTPUT_DIR }} \
            -v  # verbose 模式，输出更多日志
        continue-on-error: false

      # 如果生成失败，输出错误信息
      - name: Upload generation logs (on failure)
        if: failure() && steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generation-error-logs
          path: |
            ${{ env.OUTPUT_DIR }}/*.log
            generator/*.log

      # ---------- 6. Build Firmware ----------
      - name: Build firmware
        id: build
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          make clean
          make -j$(nproc) 2>&1 | tee build.log
        continue-on-error: false

      # 上传构建日志（无论成功失败都保留）
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.OUTPUT_DIR }}/build.log

      # ---------- 7. Run Unit Tests ----------
      - name: Run unit tests
        id: test
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          make test 2>&1 | tee test.log
        continue-on-error: true  # 允许测试失败，以便查看报告

      # 测试报告解析（如果测试框架输出 JUnit 格式，可上传）
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ env.OUTPUT_DIR }}/test.log

      # 如果测试失败，显式让 Job 失败
      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      # ---------- 8. Code Coverage ----------
      - name: Generate coverage report
        if: always() && steps.build.outcome == 'success'
        working-directory: ${{ env.OUTPUT_DIR }}
        run: |
          make coverage 2>&1 | tee coverage.log

      - name: Upload coverage reports
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            ${{ env.OUTPUT_DIR }}/**/*.gcov
            ${{ env.OUTPUT_DIR }}/**/coverage.info
            ${{ env.OUTPUT_DIR }}/**/lcov-report/

      # ---------- 9. Upload generated firmware (optional) ----------
      - name: Upload firmware binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            ${{ env.OUTPUT_DIR }}/build/*.elf
            ${{ env.OUTPUT_DIR }}/build/*.bin
            ${{ env.OUTPUT_DIR }}/build/*.hex

  # ============================================================
  # Job 3: 硬件在环测试（HIL）- 可选，需要硬件接入
  # ============================================================
  hil-test:
    name: HIL Test (Hardware in Loop)
    runs-on: ubuntu-latest
    needs: build
    # 仅在 main 分支或手动触发时执行 HIL 测试
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # 注意：HIL 需要硬件设备，GitHub Actions 原生不支持
    # 此 Job 示例为占位，实际需要自托管 Runner 或硬件云
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/

      - name: Run HIL tests
        run: |
          echo "HIL test placeholder"
          echo "Actual HIL requires self-hosted runner with hardware"
          # 这里可调用 hil_runner.py，但需要串口/调试器硬件
          # python hil_runner.py --port /dev/ttyUSB0 --baud 115200
name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 安装 ARM GCC 15.2.rel1（编译固件）
      - name: Install ARM GCC Toolchain
        run: |
          wget -q --show-progress "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz"
          tar -xf arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          echo "$PWD/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: pip install pyyaml jinja2

      - name: Generate project from YAML
        run: python generator/generate.py -i examples/rtc_advanced/hardware.yaml -o output/rtc_adv

      - name: Build firmware
        run: |
          cd output/rtc_adv
          make

      - name: Run unit tests
        run: |
          cd output/rtc_adv
          make test

      - name: Generate coverage report
        run: cd output/rtc_adv && make coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: output/rtc_adv/test/*.gcov
model: "RS485"
type: "RS485"
interface: "uart"
driver_template: ""
header_template: ""
capabilities:
  - half_duplex
  - direction_control
default_params:
  baudrate: 9600
  parity: "none"
extra_schema:
  de_pin:
    type: pin
    required: false
    default: ""
  uart:
    type: str
    required: false
    default: ""
notes:
  transport_note: >
    RS485 is a UART feature, not a standalone driver.  Configure
    UART_Serial extra.rs485_de_pin to get DE direction control in
    uart_api (TX asserts DE, RX releases it).

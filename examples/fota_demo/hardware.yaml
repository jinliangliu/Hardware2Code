mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
  hse_freq: 8000000

pins:
  # UART2 for CLI and FOTA
  - id: PA2
    function: USART2_TX
    label: DEBUG_TX
    af: 1
  - id: PA3
    function: USART2_RX
    label: DEBUG_RX
    af: 1

  # LED for bootloader heartbeat
  - id: PA5
    function: GPIO_Output
    label: LED

  # LSE pins for RTC (required for bootloader timing)
  - id: PC14
    function: GPIO_Input
    label: OSC32_IN
  - id: PC15
    function: GPIO_Input
    label: OSC32_OUT

peripherals:
  - name: debug_uart
    type: UART_Serial
    instance: USART2
    extra:
      baudrate: 115200

  - name: cli0
    type: Internal_CLI
    uart: debug_uart

  - name: onboard_rtc
    type: Internal_RTC

bootloader:
  enabled: true
  size_kb: 8
  app_a_offset: 0x2000
  app_b_offset: 0x40000
  wdg_timeout_ms: 5000
  max_retries: 3

app_tasks:
  - name: led_task
    priority: 1
    stack_size: 128

  - name: fota_monitor
    priority: 2
    stack_size: 512

sleep:
  mode: STOP0

heap_size: "0x2000"
stack_size: "0x800"

# cellular_mqtt — 4G Cat.1 + MQTT demo with LED/Button

mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64

pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
  - id: PA2
    function: USART2_TX
    label: "CELL_TX"
    af: 1
  - id: PA3
    function: USART2_RX
    label: "CELL_RX"
    af: 1
  - id: PA4
    function: CELL_PWR
    label: "CELL_PWR"
    active_level: high
  - id: PA5
    function: CELL_RST
    label: "CELL_RST"
    active_level: high

sleep:
  mode: STOP1

app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: network_task
    priority: 3
    stack_size: 1024

peripherals:
  - name: "uart2"
    type: "UART_Serial"
    instance: "USART2"
    interface: "uart"
    extra:
      baudrate: 115200
      tx_pin: "PA2"
      rx_pin: "PA3"
  - name: "cellular"
    type: "Cellular_4G"
    uart: "uart2"
    power_pin: "PA4"
    reset_pin: "PA5"
    extra:
      apn: "ctnet"
  - name: "mqtt"
    type: "Protocol_MQTT"
    bearer: "cellular"
    broker: "iot.telecom.com"
    port: 1883
    client_id: "demo_device_001"
    extra:
      keep_alive_s: 60

behavior:
  initial_state: "DISCONNECTED"
  states:
    - name: "DISCONNECTED"
      on_entry:
        - "toggle_led"
      transitions:
        - event: "BUTTON_PRESS"
          target: "CONNECTING"
          actions:
            - "toggle_led"
    - name: "CONNECTING"
      after: 10000
      transitions:
        - event: "TIMER_EXPIRED_CONNECTING_timeout"
          target: "CONNECTED"
          actions:
            - "toggle_led"
    - name: "CONNECTED"
      transitions:
        - event: "BUTTON_PRESS"
          target: "DISCONNECTED"
          actions:
            - "toggle_led"

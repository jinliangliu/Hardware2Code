# ============================================================
# hw2c minimal system unit — software tasks layer
#
# Two mandatory system tasks form the skeleton of every
# hw2c-generated firmware:
#
#   shell_task           CLI interaction + log output via USART2
#   events_process_task  Centralized event dispatch via queue
#
# Additional application tasks extend this baseline.
# ============================================================

project:
  name: base
  version: "1.0.0"
  heap_size: 16384

event_task:
  name: events_process_task
  entry: vEventTask
  priority: 3
  stack_size: 512
  queue_depth: 16

app_tasks:
  - name: shell_task
    priority: 1
    stack_size: 1024

# Button behavior — handled by event_task state machine
behavior:
  initial_state: RELEASED
  states:
    - name: RELEASED
      transitions:
        - event: BUTTON_PRESS
          target: PRESSED
          actions:
            - start_timer long_press 3000
            - toggle_led
            - 'log "button: PRESS"'
    - name: PRESSED
      transitions:
        - event: BUTTON_RELEASE
          target: RELEASED
          actions:
            - stop_timer long_press
            - toggle_led
            - 'log "button: RELEASE"'
        - event: TIMER_EXPIRED_long_press
          target: LONG_PRESS
          actions:
            - 'log "button: LONG_PRESS"'
            - "timeline: 0=>toggle_led, 200=>toggle_led, 400=>toggle_led, 600=>toggle_led, 800=>toggle_led, 1000=>toggle_led"
    - name: LONG_PRESS
      transitions:
        - event: BUTTON_RELEASE
          target: RELEASED
          actions: ['log "button: LONG_PRESS released"']

# 5-minute system heartbeat — independent periodic event
periodic_events:
  - event: MINUTE_5
    actions:
      - 'log "system: 5-min alive"'

# ============================================================
# hw2c minimal system unit — software tasks layer
#
# System tasks (FreeRTOS):
#   events_process_task  Centralized event dispatch via queue
#   cli_task             CLI interaction + log output via USART2 (auto)
#
# Components (hw2c component framework):
#   led                  LED multi-instance pattern driver
#   btn                  Button multi-instance gesture detector
# ============================================================

project:
  name: base
  version: "1.0.0"
  heap_size: 24576

event_task:
  name: events_process_task
  entry: vEventTask
  priority: 3
  stack_size: 512
  queue_depth: 16

# Button gesture → LED pattern mapping
# The btn component detects SHORT_PRESS / DOUBLE_PRESS / LONG_PRESS
# and publishes them to event_queue. The state machine
# maps each gesture to a distinct LED pattern.
behavior:
  initial_state: IDLE
  states:
    - name: IDLE
      transitions:
        - event: BUTTON_SHORT_PRESS
          target: IDLE
          actions:
            - led_pattern fast_blink
            - 'log "button: SHORT_PRESS"'
            - shell_temp
        - event: BUTTON_DOUBLE_PRESS
          target: IDLE
          actions:
            - led_pattern slow_blink
            - 'log "button: DOUBLE_PRESS"'
            - shell_temp
        - event: BUTTON_LONG_PRESS
          target: IDLE
          actions:
            - led_pattern fault
            - 'log "button: LONG_PRESS"'
            - shell_temp

# Periodic RTC alarm events
periodic_events:
  # 15-second periodic tick
  - event: TICK_15S
    actions:
      - 'log "rtc: 15s tick"'

  # 30-second telemetry report: heartbeat, stack watermarks, heap, component health
  - event: SECONDS_30
    actions:
      - 'log "system: 30-sec alive"'
      - telemetry_snapshot
      - power_status

  # 5-minute system heartbeat
  - event: MINUTE_5
    actions:
      - 'log "system: 5-min alive"'
      - telemetry_snapshot

  # 2-minute periodic tick
  - event: TICK_2MIN
    actions:
      - 'log "rtc: 2min tick"'

  # Built-in minute boundary (every minute at :00)
  - event: MINUTE_TICK
    actions:
      - 'log "rtc: minute tick"'

  # Built-in hour boundary (every hour at :00:00)
  - event: HOUR_TICK
    actions:
      - 'log "rtc: hour tick"'

  # Single-shot timers (fire once)
  - event: ONE_SHOT_5S
    actions:
      - 'log "rtc: one-shot 5s fired"'
  - event: ONE_SHOT_500MS
    actions:
      - 'log "rtc: one-shot 500ms fired"'
  - event: ONE_SHOT_2S
    actions:
      - 'log "rtc: one-shot 2s fired"'

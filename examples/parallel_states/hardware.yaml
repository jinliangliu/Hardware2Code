mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
sleep:
  mode: STOP1
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: counter_task
    priority: 3
    stack_size: 256

behavior:
  regions:
    # 区域1：LED 控制
    - name: "led_control"
      initial_state: "OFF"
      states:
        - name: "OFF"
          transitions:
            - event: "BUTTON_PRESS"
              target: "ON"
              actions:
                - "toggle_led"
        - name: "ON"
          transitions:
            - event: "BUTTON_PRESS"
              target: "OFF"
              actions:
                - "toggle_led"

    # 区域2：计数器
    - name: "counter"
      initial_state: "COUNTING"
      variables:
        - name: "count"
          type: "uint32_t"
          initial: 0
      states:
        - name: "COUNTING"
          transitions:
            - event: "RTC_TICK"
              target: "COUNTING"    # 自循环
              actions:
                - "set count inc"
mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
  - id: PA2
    function: USART2_TX
    label: "UART2_TX"
    af: 1
  - id: PA3
    function: USART2_RX
    label: "UART2_RX"
    af: 1
log:
  enable: true
sleep:
  mode: STOP1
peripherals:
  - name: "rtc"
    type: "Internal_RTC"
    interface: "internal"
    clock_source: "LSE"
    features:
      - calendar
  - name: "uart_debug"
    type: "UART_Serial"
    instance: "USART2"
    extra:
      baudrate: 115200
      tx_pin: "PA2"
      rx_pin: "PA3"

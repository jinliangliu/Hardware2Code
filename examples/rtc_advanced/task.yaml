project:
  name: rtc_advanced
  version: '0.1.0'
  heap_size: 16384
event_task:
  name: event_task
  entry: vEventTask
  priority: 3
  stack_size: 1024
  queue_depth: 32
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: rtc_demo_task
    priority: 3
    stack_size: 512
behavior:
  initial_state: "IDLE"
  variables:
    - name: "press_count"
      type: "uint32_t"
      initial: 0
  states:
    - name: "IDLE"
      after: 5000
      on_entry:
        - "toggle_led"
      on_exit:
        - "toggle_led"
      transitions:
        - event: "BUTTON_PRESS"
          target: "ACTIVE"
          guard: "press_count < 3"
          actions:
            - "defer 3000 => toggle_led"
            - "set press_count inc"
        - event: "BUTTON_PRESS"
          target: "RESET"
          actions:
            - "set press_count 0"
        - event: "TIMER_EXPIRED_IDLE_timeout"
          target: "TIMEOUT"
    - name: "ACTIVE"
      on_entry:
        - "start_timer exit_timer 3000"
      on_exit:
        - "stop_timer exit_timer"
      transitions:
        - event: "RTC_TICK"
          target: "IDLE"
        - event: "TIMER_EXPIRED_exit_timer"
          target: "IDLE"
    - name: "RESET"
      transitions:
        - event: "RTC_TICK"
          target: "IDLE"
    - name: "TIMEOUT"
      transitions:
        - event: "RTC_TICK"
          target: "IDLE"

mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
sleep:
  mode: STOP1
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: rtc_demo_task
    priority: 3
    stack_size: 512

peripherals:
  - name: "rtc"
    type: "Internal_RTC"
    interface: "internal"
    clock_source: "LSE"
    features:
      - calendar

business_flow:
  initial_state: "IDLE"
  states:
    - name: "IDLE"
      transitions:
        - event: "BUTTON_PRESS"
          target: "PROCESS"
          actions:
            - "toggle_led"
    - name: "PROCESS"
      initial_state: "STEP1"
      states:
        - name: "STEP1"
          on_entry:
            - "defer 3000 => toggle_led"
          transitions:
            - event: "RTC_TICK"
              target: "STEP2"
        - name: "STEP2"
          transitions:
            - event: "RTC_TICK"
              actions:
                - "return"
      transitions:
        - event: "RETURN"
          target: "IDLE"
          actions:
            - "toggle_led"
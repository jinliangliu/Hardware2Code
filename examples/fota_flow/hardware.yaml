# FOTA Upgrade Flow Example
# Demonstrates a complete FOTA upgrade state machine using the new dict-format actions.
# Requires: bootloader enabled + UART + RTC for timers.

mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64

bootloader:
  enabled: true
  size_kb: 8
  max_retries: 3
  app_a_offset: 0x2000
  app_b_offset: 0x40000
  crc_method: crc32_hw
  boot_flag_src: tamp_bkp

pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "fota_task"
  - id: PA2
    function: USART2_TX
    label: "UART_TX"
    af: 1
  - id: PA3
    function: USART2_RX
    label: "UART_RX"
    af: 1

sleep:
  mode: STOP1

app_tasks:
  - name: fota_task
    priority: 2
    stack_size: 512
  - name: led_task
    priority: 2
    stack_size: 128

peripherals:
  - name: "rtc"
    type: "Internal_RTC"
    interface: "internal"
    clock_source: "LSE"
    features:
      - calendar
  - name: "uart2"
    type: "UART_Serial"
    instance: "USART2"
    interface: "uart"
    extra:
      baudrate: 115200

business_flow:
  initial_state: "IDLE"
  variables:
    - name: "upgrade_attempts"
      type: "uint32_t"
      initial: 0
  events:
    - name: BUTTON_PRESS
      source: exti
      type: synchronous
    - name: FOTA_PATCH_COMPLETE
      source: custom
    - name: FOTA_VERIFY_OK
      source: custom
    - name: FOTA_VERIFY_FAIL
      source: custom
    - name: FOTA_APPLY_OK
      source: custom
    - name: FOTA_ERROR
      source: custom
  states:
    - name: "IDLE"
      transitions:
        - event: "BUTTON_PRESS"
          target: "WAIT_PATCH"
          actions:
            - "toggle_led"
            - "set upgrade_attempts 0"
    - name: "WAIT_PATCH"
      after: 30000       # 30s timeout waiting for patch
      on_entry:
        # Blink LED rapidly to indicate waiting
        - "timeline: 200=>toggle_led, 500=>toggle_led"
      transitions:
        - event: "FOTA_PATCH_COMPLETE"
          target: "VERIFY"
          actions:
            - "toggle_led"
        - event: "FOTA_ERROR"
          target: "ERROR"
          actions:
            - "toggle_led"
        - event: "TIMER_EXPIRED_WAIT_PATCH_timeout"
          target: "IDLE"
    - name: "VERIFY"
      on_entry:
        - "start_timer verify_timeout 10000"   # 10s verification timeout
      on_exit:
        - "stop_timer verify_timeout"
      transitions:
        - event: "FOTA_VERIFY_OK"
          target: "APPLY"
          actions:
            - "toggle_led"
        - event: "FOTA_VERIFY_FAIL"
          target: "RETRY"
          actions:
            - "set upgrade_attempts inc"
            - "when upgrade_attempts > 3 => publish FOTA_ERROR"
        - event: "TIMER_EXPIRED_verify_timeout"
          target: "RETRY"
          actions:
            - "set upgrade_attempts inc"
    - name: "APPLY"
      transitions:
        - event: "FOTA_APPLY_OK"
          target: "SUCCESS"
          actions:
            - "toggle_led"
        - event: "FOTA_ERROR"
          target: "ERROR"
          actions:
            - "toggle_led"
    - name: "RETRY"
      on_entry:
        - "defer 1000 => publish FOTA_PATCH_COMPLETE"
      transitions:
        - event: "FOTA_PATCH_COMPLETE"
          target: "VERIFY"
        - event: "FOTA_ERROR"
          target: "ERROR"
          actions:
            - "toggle_led"
    - name: "SUCCESS"
      transitions:
        - event: "BUTTON_PRESS"
          target: "IDLE"
          actions:
            - "toggle_led"
    - name: "ERROR"
      transitions:
        - event: "BUTTON_PRESS"
          target: "IDLE"
          actions:
            - "toggle_led"

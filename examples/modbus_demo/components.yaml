components:
  - name: shell
    type: shell_cli
    driver: usart2
    period_ms: 50
    sleep_compat: RUN
    config:
      prompt: "hw2c> "
      history_size: 8
    priority: 3
    stack_size: 1024

  - name: led
    type: led
    driver: gpio
    period_ms: 50
    config:
      default_pattern: off

  - name: btn
    type: btn
    driver: gpio
    period_ms: 10
    config:
      long_press_ms: 1000
      double_click_ms: 500
      debounce_ms: 50

  # Modbus RTU slave - wraps drv_modbus + drv_rs485
  # transport=uart: direct USB-TTL on USART1 (no RS485 DE control)
  # step() polls incoming frames; registers mirror the temperature topic.
  - name: modbus_slave
    type: modbus
    driver: usart1
    period_ms: 10
    config:
      description: "Modbus RTU slave over USB-TTL (USART1)"
      transport: uart
      uart: usart1

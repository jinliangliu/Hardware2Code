components:
  - name: shell
    type: shell_cli
    driver: usart2
    period_ms: 50
    sleep_compat: RUN
    config:
      prompt: "hw2c> "
      history_size: 8
    priority: 3
    stack_size: 1024

  - name: led
    type: led
    driver: gpio
    period_ms: 50
    config:
      default_pattern: off

  - name: btn
    type: btn
    driver: gpio
    period_ms: 10
    config:
      long_press_ms: 1000
      double_click_ms: 500
      debounce_ms: 50

  # Modbus RTU slave - wraps drv_modbus + drv_rs485
  # Modbus RTU slave over USART1 (uart_api transport; RS485 DE handled
  # by uart_api when rs485_de_pin is configured on the UART peripheral).
  #
  # To run as a master instead, use:
  #   config: { role: master, target_slave: 1, poll_interval_ms: 2000,
  #             poll_addr: 0, poll_count: 2,
  #             write_addr: 0, write_value: 123 }
  - name: modbus_slave
    type: modbus
    driver: usart1
    period_ms: 10
    config:
      description: "Modbus RTU slave over USART1"
      uart: usart1

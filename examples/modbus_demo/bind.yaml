version: 1
hardware: hardware.yaml
task: task.yaml

peripheral_assign:
  - peripheral: usart2
    task: shell_task
    role: debug_console
  - peripheral: shell
    task: shell_task
    role: cli
  - peripheral: modbus
    task: modbus_task
    role: modbus_slave
  - peripheral: rtc
    task: events_process_task
    role: tick_timer

interrupt:
  - pin: PC13
    component: btn
    event: EXTI13

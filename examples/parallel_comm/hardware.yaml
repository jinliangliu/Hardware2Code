mcu:
  part: STM32G0B1RET6
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
sleep:
  mode: STOP1
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128

behavior:
  regions:
    - name: "button_region"
      initial_state: "UP"
      states:
        - name: "UP"
          transitions:
            - event: "BUTTON_PRESS"
              target: "DOWN"
              actions:
                - "send_to led_region LED_ON"
        - name: "DOWN"
          transitions:
            - event: "BUTTON_PRESS"
              target: "UP"
              actions:
                - "send_to led_region LED_OFF"
    - name: "led_region"
      initial_state: "OFF"
      states:
        - name: "OFF"
          transitions:
            - event: "LED_ON"
              target: "ON"
              actions:
                - "toggle_led"
        - name: "ON"
          transitions:
            - event: "LED_OFF"
              target: "OFF"
              actions:
                - "toggle_led"
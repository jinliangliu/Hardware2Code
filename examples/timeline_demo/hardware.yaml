mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
sleep:
  mode: STOP1
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: rtc_demo_task
    priority: 3
    stack_size: 512

peripherals:
  - name: "rtc"
    type: "Internal_RTC"
    interface: "internal"
    clock_source: "LSE"
    features:
      - calendar

business_flow:
  initial_state: "IDLE"
  states:
    - name: "IDLE"
      transitions:
        - event: "BUTTON_PRESS"
          target: "PLAYING"
    - name: "PLAYING"
      after: 5000   # 5 秒后自动返回 IDLE
      on_entry:
        - "timeline: 1000=>toggle_led, 2000=>toggle_led, 3000=>toggle_led"
      transitions:
        - event: "TIMER_EXPIRED_PLAYING_timeout"
          target: "IDLE"
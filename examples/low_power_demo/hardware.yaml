mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
  hse_freq: 8000000

pins:
  - id: PA5
    function: GPIO_Output
    label: LED

  - id: PC13
    function: GPIO_Input
    label: BUTTON
    exti:
      enable: true
      trigger: falling

peripherals:
  - name: onboard_rtc
    type: Internal_RTC

app_tasks:
  - name: led_task
    priority: 1
    stack_size: 128

sleep:
  mode: STOP0

heap_size: "0x800"
stack_size: "0x400"

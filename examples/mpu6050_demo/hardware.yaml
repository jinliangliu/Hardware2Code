# ============================================================
# hw2c mpu6050_demo - I2C multi-device + MPU6050 attitude demo
#
#   MCU        STM32G0B1RET6 @ 16 MHz (HSI)
#   SPI1       PA5(SCK)/PA6(MISO)/PA7(MOSI) + CS=PC4
#                MPU6500-compatible IMU (accel + gyro + temp)
#   Shell      USART2 (PA2/PA3) - CLI + log @ 115200
#   LED        PC0, BUTTON PC13
# ============================================================

mcu:
  part: STM32G0B1RET6
  clock_source: HSI
  clock_freq_hz: 16000000
  core_clock_mhz: 16
  hse_freq: 8000000

pins:
  # Indicator LED — component pattern driver
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low

  # Button — EXTI both-edge input (press + release)
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: both

  # SPI1 bus — IMU chip-select (software GPIO, active low)
  - id: PA5
    function: SPI1_SCK
    label: "SPI1_SCK"
    af: 1
  - id: PA6
    function: SPI1_MISO
    label: "SPI1_MISO"
    af: 0
  - id: PA7
    function: SPI1_MOSI
    label: "SPI1_MOSI"
    af: 0
  - id: PC4
    function: GPIO_Output
    label: "MPU_CS"
    active_level: low

  # Shell UART — debug CLI + log output
  - id: PA2
    function: USART2_TX
    af: 1
  - id: PA3
    function: USART2_RX
    af: 1

peripherals:
  # Serial transport for the shell
  - name: usart2
    type: UART_Serial
    instance: USART2
    interface: uart
    extra:
      baudrate: 115200

  # CLI interactive shell
  - name: shell
    type: Internal_CLI
    uart: usart2
    extra:
      prompt: "hw2c> "

  # RTC (LSE) — 1 s periodic wakeup, timer service for telemetry events
  - name: rtc
    type: Internal_RTC
    bus: RTC
    extra:
      clock_source: LSE
      wakeup_interval_ms: 1000
      initial_time: "2026-07-29 22:07:00"
      alarms:
        - type: periodic_sec
          period_s: 1
          event: TICK_1S
        - type: periodic_sec
          period_s: 30
          event: SECONDS_30

  # MPU6500-compatible IMU on SPI1 (register map shared with MPU6050)
  - name: mpu6050
    type: SPI_Sensor_MPU6500
    bus: SPI1
    cs_pin: "PC4"
    extra:
      accel_fs: 2          # +/- 2 g
      gyro_fs: 250         # +/- 250 dps
      sample_rate_div: 4   # Fs = 1 kHz / (1 + 4) = 200 Hz

  # On-chip temperature sensor (ADC)
  - name: temp_sensor
    type: Internal_TempSensor

log:
  enable: true
  ring_buf_size: 1024

sleep:
  mode: RUN

# Runtime parameter definitions
# Read/write via shell CLI: "param get <name>", "param set <name> <value>"

params:
  - name: log_level
    component: system
    type: uint32
    default: 3
    min: 0
    max: 4
    description: "Log level (0=OFF, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG)"

  - name: telemetry_enabled
    component: system
    type: bool
    default: true
    description: "Enable periodic telemetry snapshot logging"

  - name: mpu_accel_fs
    component: imu
    type: uint32
    default: 2
    min: 2
    max: 16
    description: "MPU6050 accelerometer full scale in g (2/4/8/16)"

  - name: mpu_gyro_fs
    component: imu
    type: uint32
    default: 250
    min: 250
    max: 2000
    description: "MPU6050 gyroscope full scale in dps (250/500/1000/2000)"

  - name: attitude_alpha
    component: imu
    type: uint32
    default: 980
    min: 900
    max: 999
    description: "Complementary filter gyro weight (scaled x1000, 0.98)"

  - name: fall_free_fall_g
    component: fall
    type: float
    default: 0.4
    min: 0.1
    max: 1.0
    description: "Fall detector: free-fall threshold (|a| below, in g)"

  - name: fall_free_fall_ms
    component: fall
    type: uint32
    default: 200
    min: 50
    max: 1000
    description: "Fall detector: min free-fall duration (ms)"

  - name: fall_impact_g
    component: fall
    type: float
    default: 2.5
    min: 1.5
    max: 4.0
    description: "Fall detector: impact threshold (|a| above, in g)"

  - name: fall_still_ms
    component: fall
    type: uint32
    default: 2000
    min: 500
    max: 5000
    description: "Fall detector: stillness required after impact (ms)"

# Component registry configuration
# The mpu6050 component demonstrates the I2C bus abstraction: the bus
# (i2c1) is a shared resource opened once, and the component only uses
# its own 7-bit device address for every register transaction.

components:
  - name: shell
    type: shell_cli
    driver: usart2
    period_ms: 50
    sleep_compat: RUN
    config:
      prompt: "hw2c> "
      history_size: 8
    priority: 3
    stack_size: 1024

  - name: led
    type: led
    driver: gpio
    period_ms: 50
    sleep_compat: RUN
    config:
      default_pattern: off

  - name: btn
    type: btn
    driver: gpio
    period_ms: 10
    sleep_compat: RUN
    config:
      long_press_ms: 3000
      double_click_ms: 500
      debounce_ms: 50

  # MPU6050 IMU + attitude management component.
  # Named "imu" (distinct from the drv_mpu6050 driver functions) so the
  # component lifecycle functions are imu_init/imu_step/imu_terminate.
  # driver = the I2C bus name (shared; EEPROM lives on the same bus)
  - name: imu
    type: mpu6050
    driver: i2c1
    period_ms: 20          # 50 Hz sampling -> attitude update rate
    sleep_compat: RUN
    config:
      description: "MPU6050 IMU over shared I2C1 bus"
      bus: i2c1
      addr: 0x68
      accel_fs: 2          # +/- 2 g
      gyro_fs: 250         # +/- 250 dps
      alpha: 0.98          # complementary filter gyro weight

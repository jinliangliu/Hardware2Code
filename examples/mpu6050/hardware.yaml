mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
pins:
  - id: PB6
    function: I2C1_SCL
    label: "I2C1_SCL"
    af: 1
  - id: PB7
    function: I2C1_SDA
    label: "I2C1_SDA"
    af: 1
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "mpu6050_alert_task"
peripherals:
  - name: "mpu6050"
    type: "I2C_Sensor_MPU6050"
    bus: "I2C1"
    address: 0x68
    extra:
      accel_fs: 2          # ±2g
      gyro_fs: 250         # ±250°/s
      sample_rate_div: 0   # 1kHz
sleep:
  mode: STOP1
app_tasks:
  - name: mpu6050_alert_task
    priority: 3
    stack_size: 512
  - name: led_task
    priority: 2
    stack_size: 128
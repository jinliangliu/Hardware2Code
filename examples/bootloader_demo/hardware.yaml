# bootloader_demo — 双槽位 Bootloader + 异常恢复

mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64

# ========== Bootloader 配置 ==========
bootloader:
  enabled: true
  size_kb: 8              # Bootloader 占用 8KB Flash
  max_retries: 3          # 最大连续启动重试次数
  app_a_offset: 0x2000    # App Slot A（0x08002000，Bank1 余下）
  app_b_offset: 0x40000   # App Slot B（0x08040000，Bank2）
  crc_method: crc32_hw    # CRC32 硬件校验
  boot_flag_src: tamp_bkp  # TAMP 备份寄存器持久化

# ========== 引脚配置 ==========
pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"

# ========== 低功耗 ==========
sleep:
  mode: STOP1

# ========== FreeRTOS 任务 ==========
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: rtc_demo_task
    priority: 3
    stack_size: 512

# ========== 外设 ==========
peripherals:
  - name: "rtc"
    type: "Internal_RTC"
    interface: "internal"
    clock_source: "LSI"
    features:
      - calendar
  - name: "uart2"
    type: "UART_Serial"
    instance: "USART2"
    interface: "uart"
    extra:
      baudrate: 115200
  - name: "modbus1"
    type: "Protocol_Modbus"
    interface: "protocol"
    extra:
      role: "slave"
      bearer: "uart2"
      slave_id: 1

# ========== 业务状态机 ==========
business_flow:
  initial_state: "IDLE"
  states:
    - name: "IDLE"
      transitions:
        - event: "BUTTON_PRESS"
          target: "PLAYING"
    - name: "PLAYING"
      after: 5000   # 5 秒后自动返回 IDLE
      on_entry:
        - "toggle_led"
      transitions:
        - event: "TIMER_EXPIRED_PLAYING_timeout"
          target: "IDLE"
          actions:
            - "toggle_led"

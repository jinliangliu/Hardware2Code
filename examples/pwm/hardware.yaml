mcu:
  part: STM32G0B1RET6
pins:
  - id: PA8
    function: GPIO_Output
    label: "PWM_OUT"
    active_level: high
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
peripherals:
  - name: "pwm"
    type: "Internal_PWM"
    interface: "internal"
app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128
  - name: pwm_task
    priority: 3
    stack_size: 256
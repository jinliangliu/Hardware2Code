mcu:
  part: STM32G0B1RET6
  core_clock_mhz: 64
  hse_freq: 8000000

pins:
  - id: PC0
    function: GPIO_Output
    label: "LED"
    active_level: low
  - id: PC13
    function: GPIO_Input
    label: "BUTTON"
    pull: up
    exti:
      enable: true
      trigger: falling
    notify_task: "led_task"
  - id: PA2
    function: USART2_TX
    af: 1
  - id: PA3
    function: USART2_RX
    af: 1

sleep:
  mode: SLEEP

app_tasks:
  - name: led_task
    priority: 2
    stack_size: 128

peripherals:
  - name: "uart_debug"
    type: "UART_Serial"
    instance: "USART2"
    interface: "uart"
    extra:
      baudrate: 115200
  - name: "cli"
    type: "Internal_CLI"
    uart: "uart_debug"
    extra:
      prompt: "h2c> "

business_flow:
  initial_state: "IDLE"
  states:
    - name: "IDLE"
      after: 1000
      transitions:
        - event: "BUTTON_PRESS"
          target: "RUNNING"
          actions:
            - "toggle_led"
        - event: "TIMER_EXPIRED_IDLE_timeout"
          target: "IDLE"
    - name: "RUNNING"
      after: 5000
      transitions:
        - event: "BUTTON_PRESS"
          target: "IDLE"
          actions:
            - "toggle_led"
        - event: "TIMER_EXPIRED_RUNNING_timeout"
          target: "IDLE"
